# SubSkin 管理后台「终端」专用 tmux 配置
#
# 通过 `tmux -L subskin -f <本文件>` 加载，与运维人员的 ~/.tmux.conf 完全隔离。
# 这样做的原因（重要）：
#   服务器上的 ~/.tmux.conf 启用了 tpm / tmux-resurrect / tmux-continuum
#   （@continuum-restore on）。如果共用该配置，管理后台的 tmux 服务端会
#   在启动时尝试恢复运维人员的会话，并在自动保存时覆盖运维人员的
#   ~/.tmux/resurrect 存档，造成真实数据损失。
#
# 本文件只保留网页终端需要的选项，不加载任何插件。

# 回滚缓冲：网页终端可滚动查看的长历史
set -g history-limit 100000

# 终端能力：xterm.js 支持 256 色与 truecolor
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",*:RGB"
set -g terminal-overrides ",xterm-256color:RGB"

# 交互
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g visual-activity off
set -g visual-bell off

# 窗口编号从 0 开始，便于前端展示
set -g base-index 0
setw -g pane-base-index 0
setw -g automatic-rename on
set -g renumber-windows on

# 尺寸策略：尊重创建时/客户端给定的大小，不在多客户端间互相拉扯
set -g window-size latest
set -g aggressive-resize off

# 状态栏：简洁，仅显示会话名与时间
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "[#S] "
set -g status-left-length 40
set -g status-right "%H:%M"
set -g status-justify left

# 退出最后一个 pane 时不销毁会话之外的东西；detach 不杀会话
set -g destroy-unattached off

# Shell
set -g default-shell /bin/bash
set -g default-command "bash"
