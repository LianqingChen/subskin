# SubSkin Nginx 配置模板（正式环境）
# 实际部署以服务器 /etc/nginx/conf.d/subskin.conf 为准（AGENTS.md）。
# 本模板作为参考，已修正：prod root 指向 PWA 构建产物（非 VitePress）、
# 强制 HTTPS、补全安全头、隐藏文件/.env 拒绝、Service Worker 不缓存。

server {
    listen 80;
    server_name subskin.cn www.subskin.cn;
    # 强制 HTTPS 跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name subskin.cn www.subskin.cn;

    # ssl_certificate     /etc/letsencrypt/live/subskin.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/subskin.cn/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # ── 安全响应头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 前端静态文件（PWA 构建产物，非 VitePress）
    location / {
        root /usr/share/nginx/html/subskin;
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # API 后端代理
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式响应（RAG SSE / WebSocket）需要这些
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Service Worker & Workbox — 禁止缓存，确保浏览器始终请求最新版本
    location ~* (sw\.js|workbox-[a-f0-9]+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # 搜索相关静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control public;
    }

    # 隐藏文件 & .env 拒绝（防止泄露密钥/配置）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* /(^|/)\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
}
