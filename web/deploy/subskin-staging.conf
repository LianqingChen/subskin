# SubSkin Staging Nginx 配置 for staging.subskin.cn
# 放在 /etc/nginx/sites-available/subskin-staging
# 启用: ln -s /etc/nginx/sites-available/subskin-staging /etc/nginx/sites-enabled/subskin-staging
#
# 测试环境 — 功能验证、用户测试

server {
    listen 80;
    server_name staging.subskin.cn;

    # 测试环境静态文件
    location / {
        root /usr/share/nginx/html/subskin-staging;
        try_files $uri $uri/ /index.html;
        expires 7d;
    }

    # API 后端代理（与主站共用后端）
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;  # RAG 回答可能比较慢
    }

    # Service Worker & Workbox — 禁止缓存，确保浏览器始终请求最新版本
    location ~* (sw\.js|workbox-[a-f0-9]+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control public;
    }
}

