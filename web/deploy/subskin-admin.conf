# SubSkin Admin Nginx 配置 for admin.subskin.cn
# 部署路径: /etc/nginx/conf.d/subskin-admin.conf (服务器实际路径)
# 仓库模板: web/deploy/subskin-admin.conf
#
# ⚠️ 管理后台 (web/admin/) 是独立模块 — 不区分正式/测试环境，每次构建即上线
# ⚠️ 管理后台不使用 PWA/Service Worker，无需对应的 nginx 规则
# ⚠️ 服务器上的实际配置为准，此文件是仓库参考模板

# WebSocket / 普通请求的 Connection 头按需切换
# 2026-09-27 管理后台「终端」需要：仅在携带 Upgrade 头时发送 Connection: upgrade，
# 普通 REST 请求发送 close，避免污染既有 /api 请求语义。
map $http_upgrade $subskin_admin_conn_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl http2;
    server_name admin.subskin.cn;

    ssl_certificate /etc/letsencrypt/live/subskin.cn-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subskin.cn-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    root /usr/share/nginx/html/subskin-admin;

    # SPA fallback — admin uses hash routing (/#/dashboard), so all paths fall to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── 管理后台「终端」：需要 WebSocket 升级 + 长连接超时 ──
    # 单独成块（nginx 前缀匹配取最长者，优先于下面的 /api），
    # 因此不影响 /api 下其它接口的既有行为。
    # 需要 HTTP/1.1 才能透传 Upgrade；proxy_buffering off 保证 PTY 输出实时到达。
    location /api/admin/terminal/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $subskin_admin_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # API 后端代理（三个环境共用同一后端 127.0.0.1:8000）
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}
