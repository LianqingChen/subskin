<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>PDF 查看器</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.viewer { width: 100%; height: 100%; display: flex; flex-direction: column; }
/* ── header bar ── */
.header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #111; color: #fff; flex-shrink: 0; }
.header .title { font-size: 14px; color: #ccc; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header .page-info { font-size: 13px; color: #888; }
.header .close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 0 4px; line-height: 1; }
/* ── canvas area ── */
.canvas { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: pan-y; }
.canvas img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-select: none; }
/* ── controls ── */
.controls { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 16px; background: #111; flex-shrink: 0; }
.controls button { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.controls button:hover { background: rgba(255,255,255,0.2); }
.controls button:disabled { opacity: 0.3; cursor: default; }
.dots { display: flex; gap: 6px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: background 0.2s; }
.dots span.active { background: #22d3ee; }
/* ── loading ── */
.loading { color: #888; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="viewer">
  <div class="header">
    <button class="close" onclick="window.history.back()">&times;</button>
    <div class="title">__FILENAME__</div>
    <div class="page-info" id="pageInfo">__PAGE_INFO__</div>
  </div>
  <div class="canvas" id="canvas">
    <div class="loading" id="loading">加载中...</div>
    <img id="pageImg" src="" alt="" style="display:none">
  </div>
  <div class="controls" id="controls">
    <button id="btnPrev" onclick="prev()">‹</button>
    <div class="dots" id="dots"></div>
    <button id="btnNext" onclick="next()">›</button>
  </div>
</div>
<script>
var pages = __PAGES__;
var current = 0;
var total = pages.length;
var token = '__TOKEN__';
var img = document.getElementById('pageImg');
var loading = document.getElementById('loading');
var pageInfo = document.getElementById('pageInfo');
var canvas = document.getElementById('canvas');
var dotsEl = document.getElementById('dots');
var btnPrev = document.getElementById('btnPrev');
var btnNext = document.getElementById('btnNext');

// Build dots
for (var i = 0; i < total; i++) {
  var dot = document.createElement('span');
  if (i === 0) dot.className = 'active';
  dotsEl.appendChild(dot);
}

function updatePageInfo() {
  if (total > 1) {
    pageInfo.textContent = (current + 1) + ' / ' + total;
  }
}

function showPage(idx) {
  if (idx < 0 || idx >= total) return;
  current = idx;
  loading.style.display = 'block';
  img.style.display = 'none';
  img.src = pages[current] + '?access_token=' + token;
  img.onload = function() {
    loading.style.display = 'none';
    img.style.display = 'block';
  };
  updatePageInfo();
  // Update dots
  var dots = dotsEl.querySelectorAll('span');
  dots.forEach(function(d, i) { d.className = i === current ? 'active' : ''; });
  btnPrev.disabled = current <= 0;
  btnNext.disabled = current >= total - 1;
}

function prev() { showPage(current - 1); }
function next() { showPage(current + 1); }

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'Escape') window.history.back();
});

// Touch swipe
var touchX = 0;
canvas.addEventListener('touchstart', function(e) { touchX = e.touches[0].clientX; }, {passive: true});
canvas.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchX;
  if (dx > 50) prev();
  if (dx < -50) next();
}, {passive: true});

// Init
if (total > 0) {
  showPage(0);
} else {
  loading.innerHTML = '暂无可预览的页面<br><small style="color:#666">该文件可能是图片格式，请尝试下载查看</small>';
}
updatePageInfo();
</script>
</body>
</html>
