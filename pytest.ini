[pytest]
testpaths = tests
addopts = --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=67
# Auto-collect async tests (tests/backend/services/test_auth.py uses
# @pytest.mark.asyncio + async def). Without a mode, pytest-asyncio skips them
# with "async def functions are not natively supported".
asyncio_mode = auto
