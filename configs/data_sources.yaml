# ============================================================
# 采集策略配置
# ============================================================
collection_strategies:
  api_crawling:
    description: "通过官方API接口采集数据"
    recommended_tools: ["requests", "aiohttp", "Biopython"]
    rate_limiting: true
    caching: true

  web_scraping:
    description: "通过网页爬虫采集数据"
    recommended_tools: ["scrapy", "selenium", "beautifulsoup4"]
    ethical_guidelines:
      - "遵守robots.txt协议"
      - "设置合理采集间隔(≥3秒/请求)"
      - "仅采集公开可见内容"
      - "尊重版权，标注数据来源"

  direct_download:
    description: "直接下载PDF、CSV等文件"
    recommended_tools: ["requests", "wget"]

  git_clone:
    description: "通过Git克隆代码仓库"
    recommended_tools: ["git"]

  web_download:
    description: "通过网页下载文件"
    recommended_tools: ["requests", "selenium"]

# ============================================================
# 数据质量控制标准
# ============================================================
quality_standards:
  source_credibility:
    - "期刊影响因子评估"
    - "作者机构权威性"
    - "发表年份"
    - "来源权威度分级 (S > A > B > C > D)"

  content_validation:
    - "内容重复检测(基于标题/摘要相似度)"
    - "医学准确性验证(与权威指南交叉核对)"
    - "结构化程度评分(字段完整度)"

  data_cleaning:
    - "去除HTML标签和格式"
    - "标准化日期格式"
    - "统一作者名称格式"
    - "提取和验证DOI/PMID"

  privacy_protection:
    - "患者社区数据去除个人身份信息(PII)"
    - "匿名化处理敏感内容"
    - "遵守GDPR等数据保护法规"

