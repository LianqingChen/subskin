    cost: "free"
    data_quality: 5
    authority_tier: "A"
    authority_weight: 1.2
    priority: "priority_1"
    collection_method: "api_crawling"
    api_endpoint: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
    rate_limit: 10
    search_terms: ["vitiligo[Title/Abstract]", "vitiligo therapy", "vitiligo treatment", "nonsegmental vitiligo", "segmental vitiligo"]
    estimated_volume: 15000
    notes: "全球最具权威性的生物医学文献数据库。有NCBI_API_KEY时10 req/s"

