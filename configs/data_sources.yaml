authority_tiers:
  S: { weight: 1.5, label: "黄金标准", description: "国际/国家级诊疗指南、监管批准文件", citation_template: "根据{S}" }
  A: { weight: 1.2, label: "权威研究", description: "同行评审论文(PubMed/PMC/核心期刊)", citation_template: "一项发表在{S}的研究表明" }
  B: { weight: 1.0, label: "前沿实证", description: "临床试验注册数据、基金会研究报告", citation_template: "据{S}注册的试验数据显示" }
  C: { weight: 0.8, label: "参考补充", description: "预印本、专业媒体解读、医学科普平台", citation_template: "有报道指出{S}（尚未经同行评审）" }
  D: { weight: 0.5, label: "社区经验", description: "患者社区、百科、非专业来源", citation_template: "有白友分享{S}（个人经验，仅供参考）" }

