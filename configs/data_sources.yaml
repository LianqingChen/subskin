# 白癜风数据源分类配置文件
# 基于 comprehensive research report (2026-04-29)
# 
# 采集优先级 (collection priority):  决定"什么时候爬"
#   priority_1: 立即采集 (核心数据源 - 有API/免费)
#   priority_2: 次阶段采集 (补充数据源)
#   priority_3: 长期规划 (扩展数据源 - 付费/受限)
#
# 权威度分级 (authority tier):       决定"AI回答时信谁"
#   S (黄金标准): 诊疗指南、监管批准 → RAG权重 ×1.5
#   A (权威研究): 同行评审论文、核心期刊 → RAG权重 ×1.2
#   B (前沿实证): 临床试验、基金会报告 → RAG权重 ×1.0
#   C (参考补充): 预印本、专业媒体解读 → RAG权重 ×0.8
#   D (社区经验): 患者社区、百科科普 → RAG权重 ×0.5

categories:
  - id: "english_research"
    name: "英文研究数据库"
    description: "国际生物医学研究文献数据库"
    color: "#1e88e5"

  - id: "chinese_research"
    name: "中文医学数据库"
    description: "中文医学研究文献数据库"
    color: "#43a047"

  - id: "genomic_database"
    name: "生物信息与基因数据库"
    description: "白癜风相关基因、蛋白、组学数据"
    color: "#00acc1"

  - id: "patient_community"
    name: "患者教育与社区资源"
    description: "患者论坛、医患互动平台、医学科普"
    color: "#ffb300"

  - id: "clinical_trials"
    name: "药物与临床试验数据"
    description: "临床试验注册、药物研发管线、监管信息"
    color: "#e53935"

  - id: "guidelines"
    name: "诊疗指南与专家共识"
    description: "全球临床诊疗指南、专家共识、治疗规范"
    color: "#8e24aa"

  - id: "research_foundation"
    name: "专业组织与研究基金会"
    description: "白癜风专业研究机构、患者倡导组织、国际合作项目"
    color: "#ff7043"

  - id: "frontier_news"
    name: "研究前沿动态"
    description: "临床试验新闻、行业动态、前沿解读"
    color: "#ab47bc"

  - id: "image_data"
    name: "医学图像数据库"
    description: "皮肤病图像数据集、深度学习资源"
    color: "#78909c"

