<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>色差可见性测试</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: "PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif; background: #f6f8fa; color: #0f172a; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .muted { color: #64748b; font-size: 13px; line-height: 1.6; }
  label { display: block; margin: 8px 0; }
  select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .primary { background: #0f766e; color: #fff; }
  .ghost { background: #e2e8f0; color: #0f172a; }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  .row button { flex: 1; }
  canvas { display: block; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 8px; image-rendering: auto; }
  .bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .bar > i { display: block; height: 100%; background: #0d9488; width: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid #e2e8f0; padding: 6px 4px; text-align: left; }
  .hidden { display: none; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .grid canvas { max-width: none; border-radius: 4px; }
  .cap { font-size: 11px; color: #64748b; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>色差可见性测试</h1>

  <div id="intro" class="card">
    <p class="muted">每次会出现一张“皮肤”图。问题只有一个：<b>图里有没有一块比周围明显更浅（更白）、你打标时会标成白斑的区域？</b>
      看到就点“看到了”，没看到或拿不准就点“没看到”。约一半的图其实没有斑块，请按真实感受回答，不要猜。
      程序会自动调整斑块和周围的色差，找出你刚好能看见的那条线。</p>
    <p class="muted"><b>开始前请：</b>关闭夜览/护眼/True Tone；屏幕亮度调到 70% 以上；用你平时打标的设备和环境；整个测试过程不要改亮度。</p>
    <label>模式
      <select id="mode">
        <option value="quick">快速：3 种肤色 × 2 种大小 × 2 种背景（约 5 分钟）</option>
        <option value="full">完整：5 种肤色 × 2 种大小 × 3 种背景（约 15 分钟）</option>
      </select>
    </label>
    <label>备注（设备、环境光、是否戴眼镜等，可不填）<textarea id="note" rows="2"></textarea></label>
    <div class="row"><button class="primary" id="start">开始</button><button class="ghost" id="previewBtn">先看看长什么样</button></div>
    <p id="resumeBox" class="muted hidden">检测到上次未完成的记录。<button class="ghost" id="resume">继续上次</button></p>
  </div>

  <div id="test" class="card hidden">
    <div class="bar"><i id="bar"></i></div>
    <canvas id="cv" width="480" height="360"></canvas>
    <div class="row">
      <button class="primary" id="yes">看到了 (1)</button>
      <button class="ghost" id="no">没看到 (2)</button>
    </div>
    <p class="muted" id="status"></p>
    <div class="row">
      <button class="ghost" id="pause">暂停，稍后继续</button>
      <button class="ghost" id="early">提前结束，先看结果</button>
    </div>
  </div>

  <div id="done" class="card hidden">
    <h2 style="font-size:16px;margin:0 0 8px">完成</h2>
    <p class="muted" id="summary"></p>
    <div id="tableBox"></div>
    <div class="row">
      <button class="primary" id="download">下载当前结果 JSON</button>
      <button class="ghost hidden" id="cont">继续测试</button>
      <button class="ghost" id="again">清空并重新开始</button>
    </div>
  </div>

  <div id="preview" class="card hidden">
    <p class="muted">预览：每行一种肤色，从左到右色差 ΔE2000 依次为 2 / 4 / 6 / 8 / 12 / 18（含中等背景干扰）。</p>
    <div id="pgrid"></div>
    <div class="row"><button class="ghost" id="back">返回</button></div>
  </div>
</div>

<script>
// CORE-START
const D2R = Math.PI / 180;
function labToRgb(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const e = 216 / 24389, k = 24389 / 27;
  const xr = fx ** 3 > e ? fx ** 3 : (116 * fx - 16) / k;
  const yr = L > k * e ? fy ** 3 : L / k;
  const zr = fz ** 3 > e ? fz ** 3 : (116 * fz - 16) / k;
  const X = xr * 0.95047, Y = yr, Z = zr * 1.08883;
  const r = 3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z;
  const g = -0.969266 * X + 1.8760108 * Y + 0.041556 * Z;
  const bl = 0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z;
  const gm = c => { c = Math.min(1, Math.max(0, c)); return (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055) * 255; };
  return [gm(r), gm(g), gm(bl)];
}
function rgbToLab(r, g, b) {
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const R = lin(r), G = lin(g), B = lin(b);
  const X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
  const Y = 0.2126729 * R + 0.7151522 * G + 0.072175 * B;
  const Z = (0.0193339 * R + 0.119192 * G + 0.9503041 * B) / 1.08883;
  const e = 216 / 24389, k = 24389 / 27;
  const f = t => t > e ? Math.cbrt(t) : (k * t + 16) / 116;
  const fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function de2000(c1, c2) {
  const [L1, a1, b1] = c1, [L2, a2, b2] = c2;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cb = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Cb ** 7 / (Cb ** 7 + 25 ** 7)));
  const ap1 = (1 + G) * a1, ap2 = (1 + G) * a2;
  const Cp1 = Math.hypot(ap1, b1), Cp2 = Math.hypot(ap2, b2);
  const hp = (y, x) => { if (x === 0 && y === 0) return 0; const h = Math.atan2(y, x) / D2R; return h < 0 ? h + 360 : h; };
  const hp1 = hp(b1, ap1), hp2 = hp(b2, ap2);
  const dLp = L2 - L1, dCp = Cp2 - Cp1;
  let dhp = 0;
  if (Cp1 * Cp2 !== 0) { dhp = hp2 - hp1; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(Cp1 * Cp2) * Math.sin(dhp * D2R / 2);
  const Lbp = (L1 + L2) / 2, Cbp = (Cp1 + Cp2) / 2;
  let hbp;
  if (Cp1 * Cp2 === 0) hbp = hp1 + hp2;
  else if (Math.abs(hp1 - hp2) <= 180) hbp = (hp1 + hp2) / 2;
  else hbp = (hp1 + hp2 < 360) ? (hp1 + hp2 + 360) / 2 : (hp1 + hp2 - 360) / 2;
  const T = 1 - 0.17 * Math.cos((hbp - 30) * D2R) + 0.24 * Math.cos(2 * hbp * D2R) + 0.32 * Math.cos((3 * hbp + 6) * D2R) - 0.2 * Math.cos((4 * hbp - 63) * D2R);
  const dTheta = 30 * Math.exp(-(((hbp - 275) / 25) ** 2));
  const Rc = 2 * Math.sqrt(Cbp ** 7 / (Cbp ** 7 + 25 ** 7));
  const Sl = 1 + 0.015 * (Lbp - 50) ** 2 / Math.sqrt(20 + (Lbp - 50) ** 2);
  const Sc = 1 + 0.045 * Cbp, Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(2 * dTheta * D2R) * Rc;
  return Math.sqrt((dLp / Sl) ** 2 + (dCp / Sc) ** 2 + (dHp / Sh) ** 2 + Rt * (dCp / Sc) * (dHp / Sh));
}
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Monk Skin Tone reference swatches (approximate display colours, not measured skin)
const MST_HEX = { 1: "#f6ede4", 2: "#f3e7db", 3: "#f7ead0", 4: "#eadaba", 5: "#d7bd96", 6: "#a07e56", 7: "#825c43", 8: "#604134", 9: "#3a312a", 10: "#292420" };
function hexLab(h) { return rgbToLab(parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)); }
// vitiligo-like change: lighter, with chroma shrunk proportionally (hue preserved, never turns blue/grey)
const DL = 0.85;
const chromaKeep = s => 1 - Math.min(0.6, 0.025 * s);
function lesionColor(base, s) { const k = chromaKeep(s); return [base[0] + DL * s, base[1] * k, base[2] * k]; }
function quant(lab) { const q = labToRgb(lab[0], lab[1], lab[2]).map(Math.round); return rgbToLab(q[0], q[1], q[2]); }
function lesionOffset(base, target) {
  const realized = s => de2000(quant(base), quant(lesionColor(base, s)));
  let lo = 0, hi = 90;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (realized(m) < target) lo = m; else hi = m; }
  const s = (lo + hi) / 2, c = lesionColor(base, s);
  return { off: [c[0] - base[0], c[1] - base[1], c[2] - base[2]], realized: realized(s) };
}
// nuisance: gradient (lighting) amplitude, fine noise, mid-frequency texture, blotch (L, a)
const NUIS = [
  { name: "干净", grad: 0, fine: 0, mid: 0, blotchL: 0, blotchA: 0 },
  { name: "接近真实", grad: 4, fine: 0.8, mid: 0.8, blotchL: 1.5, blotchA: 1.5 },
  { name: "较强干扰", grad: 9, fine: 1.2, mid: 1.5, blotchL: 3, blotchA: 3 },
];
// largest dE2000 this skin tone can show along DIR before the colour clips (very light skin cannot get whiter)
function maxDE(base) { return de2000(quant(base), quant(lesionColor(base, 90))); }
function makeStair(start, maxRev, hi) { return { lvl: start, f: 1.3, lo: 0.7, hi: hi || 45, rev: [], last: null, n: 0, maxRev: maxRev || 6, done: false, censored: false, atHi: 0 }; }
function stairUpdate(s, yes) {
  const dir = yes ? -1 : 1;
  if (s.last !== null && dir !== s.last) s.rev.push(s.lvl);
  if (!yes && s.lvl >= s.hi - 1e-9) s.atHi++;
  s.last = dir; s.n++;
  s.lvl = Math.min(s.hi, Math.max(s.lo, s.lvl * (dir < 0 ? 1 / s.f : s.f)));
  if (s.atHi >= 3) { s.done = true; s.censored = true; }
  else if (s.rev.length >= s.maxRev || s.n >= 30) s.done = true;
}
function stairThreshold(s) {
  const r = s.rev.slice(-4);
  if (r.length < 2) return null;
  return Math.exp(r.reduce((a, x) => a + Math.log(x), 0) / r.length);
}
// CORE-END

function noiseField(w, h, gw, gh, rnd) {
  const g = new Float32Array((gw + 1) * (gh + 1)).map(() => rnd() * 2 - 1);
  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const fy = y / (h - 1) * gh, y0 = Math.min(gh - 1, Math.floor(fy)), ty = fy - y0;
    for (let x = 0; x < w; x++) {
      const fx = x / (w - 1) * gw, x0 = Math.min(gw - 1, Math.floor(fx)), tx = fx - x0;
      const a = g[y0 * (gw + 1) + x0], b = g[y0 * (gw + 1) + x0 + 1], c = g[(y0 + 1) * (gw + 1) + x0], d = g[(y0 + 1) * (gw + 1) + x0 + 1];
      out[y * w + x] = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
    }
  }
  return out;
}
function gauss(rnd) { return Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd()); }

// p: {base:[L,a,b], nuis, area, edge, seed, target|null}
function render(canvas, p) {
  const w = canvas.width, h = canvas.height, ctx = canvas.getContext("2d");
  const rnd = mulberry32(p.seed), N = NUIS[p.nuis];
  const blobL = noiseField(w, h, 5, 4, rnd), blobA = noiseField(w, h, 5, 4, rnd), mid = noiseField(w, h, 22, 16, rnd);
  const phi = rnd() * Math.PI * 2, gx = Math.cos(phi), gy = Math.sin(phi);
  let alpha = null, off = [0, 0, 0], realized = null;
  if (p.target != null) {
    const lo = lesionOffset(p.base, p.target); off = lo.off; realized = lo.realized;
    const R = Math.sqrt(p.area * w * h / Math.PI);
    const cx = w * (0.3 + 0.4 * rnd()), cy = h * (0.3 + 0.4 * rnd());
    const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
    alpha = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = y - cy, th = Math.atan2(dy, dx);
      const r = R * (1 + 0.18 * Math.sin(2 * th + ph[0]) + 0.12 * Math.sin(3 * th + ph[1]) + 0.08 * Math.sin(5 * th + ph[2]));
      const t = Math.min(1, Math.max(0, 0.5 + (r - Math.hypot(dx, dy)) / p.edge));
      alpha[y * w + x] = t * t * (3 - 2 * t);
    }
  }
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    const shade = N.grad * ((x / w - 0.5) * gx + (y / h - 0.5) * gy) * 2;
    let L = p.base[0] + shade + N.blotchL * blobL[i] + N.mid * mid[i] + N.fine * gauss(rnd);
    let a = p.base[1] + N.blotchA * blobA[i], b = p.base[2];
    if (alpha) { const t = alpha[i]; L += off[0] * t; a += off[1] * t; b += off[2] * t; }
    const c = labToRgb(L, a, b);
    img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return { realized };
}

// ---------- app ----------
const $ = id => document.getElementById(id);
const SIZES = [{ name: "小", area: 0.02 }, { name: "大", area: 0.10 }];
const KEY = "visibility-test-v1";
let S = null; // state

function conditions(mode) {
  const tones = mode === "full" ? [2, 4, 6, 8, 10] : [2, 6, 10];
  const nuis = mode === "full" ? [0, 1, 2] : [0, 1];
  const out = [];
  for (const t of tones) for (const si of [0, 1]) for (const n of nuis) out.push({ id: `MST${t}|${SIZES[si].name}|${NUIS[n].name}`, tone: t, size: si, nuis: n });
  return out;
}
function newState(mode, note) {
  const conds = conditions(mode);
  const stairs = conds.map(c => { const hi = Math.min(45, 0.97 * maxDE(hexLab(MST_HEX[c.tone]))); return makeStair(Math.min(10, hi * 0.8), 6, hi); });
  return { v: 1, mode, note, started: new Date().toISOString(), conds, stairs, trials: [], seed: (Math.random() * 2 ** 31) | 0, cur: null,
    env: { screen: [screen.width, screen.height], dpr: window.devicePixelRatio, ua: navigator.userAgent } };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function show(id) { for (const k of ["intro", "test", "done", "preview"]) $(k).classList.toggle("hidden", k !== id); }

function nextTrial() {
  const active = S.conds.map((c, i) => i).filter(i => !S.stairs[i].done);
  if (!active.length) return finish();
  const rnd = mulberry32(S.seed + S.trials.length * 7919 + 13);
  const catchTrial = rnd() < 0.3;
  const ci = catchTrial ? Math.floor(rnd() * S.conds.length) : active[Math.floor(rnd() * active.length)];
  const c = S.conds[ci];
  S.cur = { idx: S.trials.length, ci, cond: c.id, tone: c.tone, size: SIZES[c.size].name, nuis: NUIS[c.nuis].name, catchTrial,
    edge: rnd() < 0.5 ? 2 : 6, seed: Math.floor(rnd() * 2 ** 31), target: catchTrial ? null : S.stairs[ci].lvl, t0: 0 };
  const cv = $("cv"), ctx = cv.getContext("2d");
  ctx.fillStyle = "#b0b0b0"; ctx.fillRect(0, 0, cv.width, cv.height);
  const cur = S.cur;
  setTimeout(() => {
    if (S.cur !== cur) return; // paused or finished during the blank gap
    const r = render(cv, { base: hexLab(MST_HEX[c.tone]), nuis: c.nuis, area: SIZES[c.size].area, edge: cur.edge, seed: cur.seed, target: cur.target });
    cur.realized = r.realized; cur.t0 = performance.now();
  }, 350);
  const done = S.stairs.filter(s => s.done).length;
  $("bar").style.width = (100 * done / S.conds.length) + "%";
  $("status").textContent = `已达标 ${done}/${S.conds.length} 个条件 · 第 ${S.trials.length + 1} 题 · 进度自动保存，可随时暂停`;
}
function refreshResume() {
  try {
    const old = JSON.parse(localStorage.getItem(KEY) || "null");
    const ok = old && old.trials && old.trials.length && old.stairs.some(s => !s.done);
    $("resumeBox").classList.toggle("hidden", !ok);
  } catch (e) {}
}
function pause() { if (!S) return; S.cur = null; save(); show("intro"); refreshResume(); }
function early() { if (!S) return; S.cur = null; save(); finish(); }
function answer(yes) {
  if (!S || !S.cur || !S.cur.t0) return;
  const t = S.cur;
  S.trials.push({ i: t.idx, cond: t.cond, tone: t.tone, size: t.size, nuis: t.nuis, edgePx: t.edge, seed: t.seed, lesion: !t.catchTrial,
    targetDE00: t.target, realizedDE00: t.realized, response: yes ? "yes" : "no", rtMs: Math.round(performance.now() - t.t0) });
  if (!t.catchTrial) stairUpdate(S.stairs[t.ci], yes);
  S.cur = null; save(); nextTrial();
}
function finish() {
  show("done"); save();
  const rows = S.conds.map((c, i) => ({ id: c.id, thr: stairThreshold(S.stairs[i]), n: S.stairs[i].n, hi: S.stairs[i].hi, censored: S.stairs[i].censored, done: S.stairs[i].done }));
  const complete = rows.every(r => r.done), finished = rows.filter(r => r.done).length;
  const catches = S.trials.filter(t => !t.lesion), fa = catches.filter(t => t.response === "yes").length;
  $("summary").textContent = `共 ${S.trials.length} 题，其中无斑块对照 ${catches.length} 题，你误报“看到了” ${fa} 题（${catches.length ? (100 * fa / catches.length).toFixed(0) : 0}%）。` +
    (complete ? "全部条件已达标。下表是你刚好能看见（约 50%）的色差 ΔE2000，越小说明越敏感。请下载结果发给我。"
      : `已达标 ${finished}/${rows.length} 个条件，其余标为“未完成”（括号内只是粗略估计，仅供参考）。进度已保存，可以先下载当前结果，也可以继续测试。`);
  const cell = r => r.censored ? "> " + r.hi.toFixed(1) + "（该肤色色差已到上限仍没看到）"
    : r.done ? (r.thr == null ? "—" : r.thr.toFixed(1))
    : "未完成" + (r.thr == null ? "" : `（约 ${r.thr.toFixed(1)}）`);
  $("tableBox").innerHTML = "<table><tr><th>条件</th><th>阈值 ΔE2000</th><th>题数</th></tr>" +
    rows.map(r => `<tr><td>${r.id}</td><td>${cell(r)}</td><td>${r.n}</td></tr>`).join("") + "</table>";
  $("cont").classList.toggle("hidden", complete);
}
function download() {
  const out = { ...S, complete: S.stairs.every(s => s.done),
    thresholds: S.conds.map((c, i) => ({ cond: c.id, converged: S.stairs[i].done, thresholdDE00: stairThreshold(S.stairs[i]), censoredAbove: S.stairs[i].censored ? S.stairs[i].hi : null })),
    exportedAt: new Date().toISOString() };
  delete out.cur;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "visibility-test-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "") + ".json";
  a.click();
}
function preview() {
  show("preview");
  const g = $("pgrid"); g.innerHTML = "";
  for (const tone of [2, 6, 10]) {
    const row = document.createElement("div"); row.className = "grid"; row.style.marginBottom = "8px";
    for (const de of [2, 4, 6, 8, 12, 18]) {
      const box = document.createElement("div"), cv = document.createElement("canvas"); cv.width = 160; cv.height = 120;
      const r = render(cv, { base: hexLab(MST_HEX[tone]), nuis: 1, area: 0.10, edge: 3, seed: 1000 + tone * 17 + de, target: de });
      const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = `MST${tone} ΔE ${r.realized.toFixed(1)}`;
      box.append(cv, cap); row.append(box);
    }
    g.append(row);
  }
}

$("start").onclick = () => { S = newState($("mode").value, $("note").value); save(); show("test"); nextTrial(); };
$("resume").onclick = () => { S = JSON.parse(localStorage.getItem(KEY)); show("test"); nextTrial(); };
$("yes").onclick = () => answer(true);
$("no").onclick = () => answer(false);
$("download").onclick = download;
$("pause").onclick = pause;
$("early").onclick = early;
$("cont").onclick = () => { show("test"); nextTrial(); };
$("again").onclick = () => { if (!confirm("会清空已保存的进度，确定重新开始吗？（建议先下载当前结果）")) return; localStorage.removeItem(KEY); S = null; show("intro"); refreshResume(); };
$("previewBtn").onclick = preview;
$("back").onclick = () => show("intro");
document.addEventListener("keydown", e => { if (e.key === "1") answer(true); else if (e.key === "2") answer(false); });
refreshResume();
if (location.search.includes("preview")) preview();
if (location.search.includes("selftest")) { // simulated observer (true threshold 5 dE2000); only for checking the flows end to end
  const variant = (location.search.match(/selftest=(\w+)/) || [])[1] || "full";
  const probe = document.createElement("pre"); probe.id = "probe"; document.body.append(probe);
  const log = o => { probe.textContent += JSON.stringify(o) + "\n"; };
  S = newState("quick", "selftest"); show("test"); nextTrial();
  let acted = false;
  const tick = () => {
    if (variant !== "full" && !acted && S.trials.length >= 40) {
      acted = true;
      if (variant === "early") {
        early();
        log({ step: "early", visible: !$("done").classList.contains("hidden"), summary: $("summary").textContent.slice(0, 90), contHidden: $("cont").classList.contains("hidden"),
          unfinishedRows: (($("tableBox").innerHTML.match(/未完成/g)) || []).length, saved: JSON.parse(localStorage.getItem(KEY)).trials.length });
        $("cont").click();
      } else {
        pause();
        log({ step: "pause", introVisible: !$("intro").classList.contains("hidden"), resumeVisible: !$("resumeBox").classList.contains("hidden"), saved: JSON.parse(localStorage.getItem(KEY)).trials.length });
        S = null; $("resume").click(); // fresh load from localStorage, as after a page reload
        log({ step: "resumed", trialsRestored: S.trials.length });
      }
    }
    if (S && S.cur && S.cur.t0) answer(!S.cur.catchTrial && S.cur.realized > 5.0);
    if (S && !S.cur && !$("done").classList.contains("hidden")) { clearInterval(timer); log({ step: "finished", summary: $("summary").textContent.slice(0, 70), total: S.trials.length, complete: S.stairs.every(s => s.done) }); }
  };
  const timer = setInterval(tick, 5);
}
</script>
